# Development — local Docker Compose stack
# Usage:
#   cp .env.example .env
#   docker compose --env-file .env up -d --build
#
# API: http://localhost:8080
# Install wizard: http://localhost:8080/installation

name: commerce-dev

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - commerce-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - commerce-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  commerce:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Commerce__ApplicationName: Commerce
      Commerce__Environment: Development
      Commerce__BaseUrl: ${COMMERCE_BASE_URL:-http://localhost:8080}
      Commerce__Database__Provider: SqlServer
      Commerce__Database__ConnectionString: >-
        Server=sqlserver,1433;Database=Commerce;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;
      Commerce__Cache__Enabled: "true"
      Commerce__Cache__Provider: Redis
      Commerce__Cache__RedisConnectionString: redis:6379
      Commerce__Media__StorageRoot: App_Data/media
      Commerce__Deployment__ApplyMigrationsOnStartup: "false"
      Commerce__Deployment__WaitForDatabaseSeconds: "90"
      Commerce__DisasterRecovery__MediaRoot: App_Data/media
      Commerce__DisasterRecovery__PluginsRoot: Plugins
      Commerce__DisasterRecovery__EnableScheduledBackups: "false"
      Commerce__Cors__AllowedOrigins__0: http://localhost:4200
      Commerce__Cors__AllowedOrigins__1: http://localhost:4201
    volumes:
      - commerce-app-data:/app/App_Data
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  commerce-sql-data:
  commerce-redis-data:
  commerce-app-data:
